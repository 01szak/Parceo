<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  @if (data.message) {
    <p class="message">{{ data.message }}</p>
  }

  @if (data.component) {
    <ng-container *ngComponentOutlet="data.component; inputs: data.componentData" />
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">{{ cancelLabel }}</button>
  <button mat-flat-button type="button" [class.danger]="isDanger" (click)="confirm()">{{ confirmLabel }}</button>
</mat-dialog-actions>
