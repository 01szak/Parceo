<main class="page">
  <section class="card" aria-labelledby="login-title">
    <app-parceo-logo [size]="56" [showName]="false" />

    <div class="heading">
      <h1 id="login-title">Logowanie</h1>
      <p>Zaloguj się do panelu swojego kempingu.</p>
    </div>

    @if (errorMessage()) {
      <div class="error-banner" role="alert">
        <mat-icon aria-hidden="true">error</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field>
        <mat-label>Login</mat-label>
        <input matInput formControlName="login" autocomplete="username" required>
        <mat-error>Podaj login.</mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Hasło</mat-label>
        <input matInput formControlName="password" autocomplete="current-password" required
               [type]="passwordVisible() ? 'text' : 'password'">
        <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()"
                [attr.aria-label]="passwordVisible() ? 'Ukryj hasło' : 'Pokaż hasło'"
                [attr.aria-pressed]="passwordVisible()">
          <mat-icon>{{ passwordVisible() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error>Podaj hasło.</mat-error>
      </mat-form-field>

      <button mat-flat-button type="submit" class="submit" [disabled]="submitting()">
        @if (submitting()) {
          <mat-progress-spinner mode="indeterminate" diameter="20" aria-label="Logowanie" />
        } @else {
          Zaloguj się
        }
      </button>
    </form>
  </section>
</main>
