
spring.liquibase.contexts=${SPRING_PROFILES_ACTIVE}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

rsa.private-key=${RSA_PRIVATE_KEY}
rsa.public-key=${RSA_PUBLIC_KEY}

novu.secret-key=${NOVU_SECRET_KEY}
novu.server-url=${NOVU_SERVER_URL}

logging.file.path=/var/log/camper_park/${SPRING_PROFILES_ACTIVE}

